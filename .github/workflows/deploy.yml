name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "latest"
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build Hugo
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Verify agentic readiness
        run: bash scripts/verify-agentic.sh public

      - name: Build Pagefind index
        run: npx pagefind --site public

      - name: Add CNAME for custom domain
        run: echo "johnmatrix.org" > public/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  # Advisory quality report (NOT a deploy gate): build the site, serve it
  # locally, and report Lighthouse category scores. Assertions are "warn" so
  # the job stays green; deploy does NOT depend on this job. Review the scores
  # in the logs / uploaded artifact; a dip never blocks a deploy.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "latest"
          extended: true

      # localhost baseURL so absolute asset + canonical URLs resolve against
      # the local server on the same port Lighthouse audits.
      - name: Build Hugo (local audit build)
        run: hugo --minify --baseURL "http://localhost:8080/"

      - name: Build Pagefind index
        run: npx pagefind --site public

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Serve build and run Lighthouse (assertions gate)
        run: |
          npx --yes http-server public -p 8080 --silent &
          npx --yes wait-on http://localhost:8080/ --timeout 60000
          # Pass --config explicitly: lhci does not reliably auto-discover
          # lighthouserc.json, and autorun otherwise auto-detects ./public as a
          # staticDistDir and drops collect.url (applying no assertions).
          # `lhci assert` exit code is the deploy gate; upload is best-effort.
          lhci collect --config=./lighthouserc.json
          lhci assert --config=./lighthouserc.json
          lhci upload --config=./lighthouserc.json || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 30

  deploy:
    # Only deploy on push to main / manual dispatch, never on pull_request.
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
