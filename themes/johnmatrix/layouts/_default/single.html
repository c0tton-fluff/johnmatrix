{{ define "main" }}
<article class="content single-content">
  {{- if not (eq .Title "") -}}
    <h1 class="article-title">{{ .Title }}</h1>
  {{- end -}}

  {{- partial "breadcrumbs.html" . -}}

  {{- with .Params.tags -}}
    <div class="tags">
      {{- range . -}}
        <a class="tag-link" href="{{ "/tags/" | relLangURL }}{{ . | urlize }}/">#{{ . }}</a>
      {{- end -}}
    </div>
  {{- end -}}

  {{- .Content -}}

  {{- if gt .WordCount 200 -}}
    {{- partial "toc.html" . -}}
  {{- end -}}
</article>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ .Title | plainify | jsonify }},
  "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "url": {{ .Permalink | jsonify }},
  {{- with .Params.tags -}}
  "keywords": {{ delimit . ", " | jsonify }},
  {{- end -}}
  "author": {
    "@type": "Person",
    "name": "johnmatrix"
  },
  "publisher": {
    "@type": "Person",
    "name": "johnmatrix",
    "url": {{ .Site.BaseURL | jsonify }}
  }
}
</script>
{{ end }}
