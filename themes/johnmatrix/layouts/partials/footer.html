<footer>
  <div class="footer-links">
    <a href="/about/">About</a>
    <a href="/contact/">Contact</a>
    <a href="/privacy/">Privacy</a>
    {{- with .Site.Params.github -}}
      <a href="{{ . }}" rel="noopener noreferrer">GitHub</a>
    {{- end -}}
    <a href="{{ "/index.xml" | relURL }}" type="application/rss+xml">RSS</a>
  </div>
  <div class="footer-meta">
    <span class="footer-signoff"><span class="footer-prompt">$</span> exit</span>
    <span>{{ .Site.Title }} — {{ now.Format "2006" }}</span>
  </div>
</footer>
