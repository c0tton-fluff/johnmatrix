{{- $title := .Title -}}
{{- $url := .Permalink -}}
{{- $desc := .Description | default .Site.Params.description -}}

<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:title" content="{{ $title | plainify | htmlEscape }}">
<meta property="og:description" content="{{ $desc | plainify | htmlEscape }}">
<meta property="og:url" content="{{ $url }}">
<meta property="og:site_name" content="{{ .Site.Title }}">

<meta property="og:image" content="{{ "/og-image.png" | absURL }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ "/og-image.png" | absURL }}">
<meta name="twitter:title" content="{{ $title | plainify | htmlEscape }}">
<meta name="twitter:description" content="{{ $desc | plainify | htmlEscape }}">

{{- if .IsPage -}}
  <meta property="article:modified_time" content="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">
{{- end -}}
