{{- $latest := first 6 .Site.RegularPages.ByDate.Reverse -}}
{{- if $latest -}}
<hr>
<h2 class="section-title">Latest</h2>
<ul class="latest-list">
  {{- range $latest -}}
  <li class="latest-row reveal">
    <span class="latest-date">{{ .Date.Format "2006-01-02" }}</span>
    <span class="latest-section">[{{ .Section }}]</span>
    <a class="latest-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
  {{- end -}}
</ul>
{{- end -}}
