name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build Hugo
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build Pagefind index
        run: npx pagefind --site public

      - name: Add CNAME for custom domain
        run: echo "johnmatrix.org" > public/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  # Quality gate: build the site, serve it locally, and assert Lighthouse
  # category scores before anything is allowed to deploy. Runs on PRs too so
  # it can gate merges. Auditing the local build (not live prod) means a bad
  # build is caught here instead of after it is already public.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      # localhost baseURL so absolute asset + canonical URLs resolve against
      # the local server on the same port Lighthouse audits.
      - name: Build Hugo (local audit build)
        run: hugo --minify --baseURL "http://localhost:8080/"

      - name: Build Pagefind index
        run: npx pagefind --site public

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Serve build and run Lighthouse (assertions gate)
        run: |
          npx --yes http-server public -p 8080 --silent &
          npx --yes wait-on http://localhost:8080/ --timeout 60000
          # Pass --config explicitly: lhci does not reliably auto-discover
          # lighthouserc.json, and autorun otherwise auto-detects ./public as a
          # staticDistDir and drops collect.url (applying no assertions).
          # `lhci assert` exit code is the deploy gate; upload is best-effort.
          lhci collect --config=./lighthouserc.json
          lhci assert --config=./lighthouserc.json
          lhci upload --config=./lighthouserc.json || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 30

  deploy:
    # Only deploy on push to main / manual dispatch, never on pull_request.
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    needs: [build, lighthouse]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
