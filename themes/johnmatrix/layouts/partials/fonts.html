{{- $fonts := slice
  "JetBrains Mono"
  "IBM Plex Sans"
-}}
{{- range $fonts -}}
  {{- $name := replace . " " "+" -}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{ $name }}:wght@400;500;600;700&display=swap">
{{- end -}}
